name: testes

on:
  push:
    branches: ["produção", "homologação"]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff
        run: ruff check verbete experimentos testes
      # Nenhum teste chama a API da Camara. O que se verifica e a logica de
      # metrica e de modelo, com corpus sintetico de resposta conhecida; teste
      # que depende de servico externo quebra a integracao continua por motivo
      # que nao tem a ver com o codigo.
      - name: testes
        run: pytest testes/ -q
